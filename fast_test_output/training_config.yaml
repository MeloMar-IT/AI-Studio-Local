checkpoints:
  interval: null
  keep_last_n: 1
  precision: bfloat16
data:
  num_dataloader_workers: 0
  preprocessed_data_root: mock_training_data
flow_matching:
  timestep_sampling_mode: shifted_logit_normal
  timestep_sampling_params: {}
hub:
  hub_model_id: null
  push_to_hub: false
lora:
  alpha: 16
  dropout: 0.0
  rank: 8
  target_modules:
  - to_q
  - to_k
  - to_v
  - to_out.0
model:
  load_checkpoint: null
  model_path: models/ltx-2.3-mlx
  text_encoder_path: null
  training_mode: lora
  transformer_file: transformer-dev.safetensors
optimization:
  batch_size: 1
  enable_gradient_checkpointing: false
  gradient_accumulation_steps: 1
  learning_rate: 0.0001
  max_grad_norm: 1.0
  optimizer_type: adamw
  scheduler_params: {}
  scheduler_type: linear
  steps: 3
  weight_decay: 0.0
output_dir: /Users/marcelkoert/IdeaProjects/AI Studio Local/fast_test_output
seed: 42
training_strategy:
  generate_audio: true
  name: text_to_video
validation:
  frame_rate: 25.0
  generate_audio: true
  guidance_scale: 4.0
  images: null
  include_reference_in_output: false
  inference_steps: 50
  interval: null
  negative_prompt: worst quality, inconsistent motion, blurry, jittery, distorted
  prompts: []
  reference_downscale_factor: 1
  reference_videos: null
  seed: 42
  skip_initial_validation: false
  stg_blocks:
  - 29
  stg_mode: stg_av
  stg_scale: 1.0
  video_dims: !!python/tuple
  - 960
  - 544
  - 97
  videos_per_prompt: 1
wandb:
  enabled: false
  entity: null
  log_validation_videos: true
